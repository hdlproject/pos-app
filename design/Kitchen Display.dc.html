<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Manrope', system-ui, sans-serif; color: #f2e9dc; background: #1a1712; -webkit-font-smoothing: antialiased; }
  a { color: #f0a86a; text-decoration: none; }
  a:hover { color: #f6c193; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #3a332a; border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;background:#1a1712;color:#f2e9dc;">

  <header style="display:flex;align-items:center;gap:16px;padding:14px 22px;background:#211d16;border-bottom:1px solid #322b21;position:sticky;top:0;z-index:20;">
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="width:40px;height:40px;border-radius:11px;background:#c65d3b;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'DM Serif Display',serif;font-size:22px;line-height:1;">K</div>
      <div style="line-height:1.15;">
        <div style="font-family:'DM Serif Display',serif;font-size:19px;color:#f7efe2;">Kitchen Display</div>
        <div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8a7c66;font-weight:700;">Kopi &amp; Co · Live</div>
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-left:12px;">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
        <button onClick="{{ f.onClick }}" style="{{ f.style }}">
          <span>{{ f.label }}</span>
          <span style="{{ f.countStyle }}">{{ f.count }}</span>
        </button>
      </sc-for>
    </div>

    <div style="display:flex;align-items:center;gap:18px;margin-left:auto;">
      <div style="display:flex;align-items:center;gap:14px;">
        <sc-for list="{{ legend }}" as="lg" hint-placeholder-count="3">
          <div style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#b8ab95;">
            <span style="{{ lg.dot }}"></span>{{ lg.label }}
          </div>
        </sc-for>
      </div>
      <div style="display:flex;align-items:center;gap:8px;padding:7px 14px;background:#2a251c;border-radius:30px;">
        <span style="width:8px;height:8px;border-radius:50%;background:#5fbf7f;box-shadow:0 0 0 3px rgba(95,191,127,.2);"></span>
        <span style="font-size:12.5px;font-weight:700;color:#cabba3;">Connected</span>
      </div>
      <div style="font-family:'Manrope',sans-serif;font-size:22px;font-weight:800;color:#f7efe2;letter-spacing:.02em;">{{ clock }}</div>
    </div>
  </header>

  <main style="flex:1;padding:18px 20px 26px;overflow-x:auto;">
    <div style="display:grid;grid-auto-flow:column;grid-auto-columns:308px;gap:16px;align-items:start;min-height:calc(100vh - 130px);">
      <sc-for list="{{ tickets }}" as="tk" hint-placeholder-count="5">
        <div style="{{ tk.cardStyle }}">
          <div style="{{ tk.headStyle }}">
            <div style="display:flex;align-items:center;gap:9px;">
              <span style="{{ tk.typeBadge }}">{{ tk.typeLabel }}</span>
              <span style="font-size:16px;font-weight:800;color:#f7efe2;">{{ tk.title }}</span>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;">
              <span style="font-size:12px;font-weight:800;color:#f7efe2;">{{ tk.orderNo }}</span>
              <span style="{{ tk.timerStyle }}">{{ tk.timer }}</span>
            </div>
          </div>

          <div style="padding:6px 6px 4px;">
            <sc-for list="{{ tk.items }}" as="it" hint-placeholder-count="3">
              <button onClick="{{ it.onToggle }}" style="{{ it.rowStyle }}">
                <span style="{{ it.checkStyle }}">{{ it.check }}</span>
                <span style="font-size:14px;font-weight:800;color:#f7efe2;min-width:26px;">{{ it.qtyLabel }}</span>
                <span style="flex:1;text-align:left;">
                  <span style="{{ it.nameStyle }}">{{ it.name }}</span>
                  <sc-if value="{{ it.note }}" hint-placeholder-val="{{ false }}">
                    <span style="display:block;font-size:11.5px;font-weight:700;color:#e0a06a;margin-top:2px;">✎ {{ it.note }}</span>
                  </sc-if>
                </span>
                <span style="{{ it.pillStyle }}">{{ it.stateLabel }}</span>
              </button>
            </sc-for>
          </div>

          <div style="padding:10px 10px 12px;margin-top:auto;">
            <button onClick="{{ tk.onAdvance }}" style="{{ tk.advanceStyle }}">{{ tk.advanceLabel }}</button>
          </div>
        </div>
      </sc-for>

      <sc-if value="{{ allEmpty }}" hint-placeholder-val="{{ false }}">
        <div style="width:308px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:60px 24px;color:#6f6252;text-align:center;">
          <div style="width:60px;height:60px;border-radius:16px;background:#241f18;display:flex;align-items:center;justify-content:center;font-size:26px;">🍳</div>
          <div style="font-weight:800;color:#8a7c66;">All caught up</div>
          <div style="font-size:12.5px;line-height:1.45;">No open tickets in this view.</div>
        </div>
      </sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:760}}">
class Component extends DCLogic {
  state = {
    filter: 'all',
    clock: '',
    // per-item state overrides keyed "ticketId:itemIdx" -> 'queued'|'preparing'|'ready'
    itemState: {},
  };

  seed() {
    return [
      { id: 'o1', no: '#1042', type: 'dine_in', where: 'Table 5', placedMin: 12, items: [
        { name: 'Beef Rendang Rice', qty: 1, s: 'preparing', note: 'less spicy' },
        { name: 'Nasi Goreng Spesial', qty: 2, s: 'preparing' },
        { name: 'Teh Tarik', qty: 2, s: 'ready' },
      ]},
      { id: 'o2', no: '#1043', type: 'takeaway', where: 'Takeaway', placedMin: 8, items: [
        { name: 'Chicken Katsu Rice', qty: 1, s: 'preparing' },
        { name: 'French Fries', qty: 1, s: 'queued' },
        { name: 'Cold Brew', qty: 1, s: 'ready' },
      ]},
      { id: 'o3', no: '#1044', type: 'delivery', where: 'Delivery', placedMin: 6, items: [
        { name: 'Club Sandwich', qty: 2, s: 'queued' },
        { name: 'Onion Rings', qty: 1, s: 'queued' },
        { name: 'Chicken Wings', qty: 1, s: 'queued', note: '6 pc, extra glaze' },
      ]},
      { id: 'o4', no: '#1045', type: 'dine_in', where: 'Table 2', placedMin: 3, items: [
        { name: 'Cappuccino', qty: 1, s: 'queued' },
        { name: 'Butter Croissant', qty: 2, s: 'queued' },
      ]},
      { id: 'o5', no: '#1046', type: 'dine_in', where: 'Table 8', placedMin: 1, items: [
        { name: 'Matcha Latte', qty: 2, s: 'queued' },
        { name: 'Cheesecake Slice', qty: 1, s: 'queued' },
        { name: 'Cinnamon Roll', qty: 1, s: 'queued' },
      ]},
    ];
  }

  componentDidMount() {
    const tick = () => {
      const d = new Date();
      this.setState({ clock: d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) });
    };
    tick();
    this._t = setInterval(tick, 15000);
  }
  componentWillUnmount() { clearInterval(this._t); }

  itemStateOf(tkId, idx, def) {
    return this.state.itemState[tkId + ':' + idx] || def;
  }

  cycleItem(tkId, idx, def) {
    const order = ['queued', 'preparing', 'ready'];
    const cur = this.itemStateOf(tkId, idx, def);
    const next = order[(order.indexOf(cur) + 1) % order.length];
    this.setState(s => ({ itemState: { ...s.itemState, [tkId + ':' + idx]: next } }));
  }

  advanceTicket(tk, orderStatus) {
    // If not all ready -> mark all ready. If all ready -> clear (served/bumped).
    this.setState(s => {
      const m = { ...s.itemState };
      if (orderStatus === 'ready') {
        tk.items.forEach((_, i) => { m[tk.id + ':' + i] = 'bumped'; });
      } else {
        tk.items.forEach((_, i) => { m[tk.id + ':' + i] = 'ready'; });
      }
      return { itemState: m };
    });
  }

  typeMeta(t) {
    if (t === 'dine_in') return { label: 'Dine-in', bg: '#2b3a2f', fg: '#8fd3a4' };
    if (t === 'takeaway') return { label: 'Takeaway', bg: '#3a3320', fg: '#e0c06a' };
    return { label: 'Delivery', bg: '#3a2b2b', fg: '#e59a86' };
  }

  stateMeta(s) {
    if (s === 'ready') return { label: 'Ready', dot: '#5fbf7f', pillBg: 'rgba(95,191,127,.16)', pillFg: '#8fd3a4' };
    if (s === 'preparing') return { label: 'Preparing', dot: '#e0a86a', pillBg: 'rgba(224,168,106,.16)', pillFg: '#e8b884' };
    return { label: 'Queued', dot: '#7d7364', pillBg: 'rgba(150,138,120,.14)', pillFg: '#b8ab95' };
  }

  renderVals() {
    const s = this.state;
    let data = this.seed().map(tk => {
      const items = tk.items.map((it, i) => {
        const st = this.itemStateOf(tk.id, i, it.s);
        return { ...it, st, idx: i };
      });
      const visible = items.filter(it => it.st !== 'bumped');
      const allReady = visible.length > 0 && visible.every(it => it.st === 'ready');
      const anyPrep = visible.some(it => it.st === 'preparing');
      const orderStatus = visible.length === 0 ? 'bumped' : (allReady ? 'ready' : (anyPrep ? 'preparing' : 'queued'));
      return { ...tk, items, orderStatus, allReadyVisible: allReady };
    }).filter(tk => tk.orderStatus !== 'bumped');

    if (s.filter !== 'all') data = data.filter(tk => tk.type === s.filter);

    const counts = (t) => this.seed().filter(x => t === 'all' ? true : x.type === t).length;
    const filters = [
      { key: 'all', label: 'All orders' },
      { key: 'dine_in', label: 'Dine-in' },
      { key: 'takeaway', label: 'Takeaway' },
      { key: 'delivery', label: 'Delivery' },
    ].map(f => {
      const active = s.filter === f.key;
      return {
        label: f.label,
        count: counts(f.key),
        onClick: () => this.setState({ filter: f.key }),
        style: `display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:11px;border:1px solid ${active ? '#c65d3b' : '#322b21'};background:${active ? '#c65d3b' : '#241f18'};color:${active ? '#fff' : '#b8ab95'};font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:all .12s;`,
        countStyle: `font-size:11px;font-weight:800;padding:1px 7px;border-radius:20px;background:${active ? 'rgba(255,255,255,.22)' : '#181510'};color:${active ? '#fff' : '#8a7c66'};`,
      };
    });

    const legend = [
      { label: 'Queued', c: '#7d7364' },
      { label: 'Preparing', c: '#e0a86a' },
      { label: 'Ready', c: '#5fbf7f' },
    ].map(l => ({ label: l.label, dot: `width:9px;height:9px;border-radius:50%;background:${l.c};` }));

    const tickets = data.map(tk => {
      const tm = this.typeMeta(tk.type);
      const late = tk.placedMin >= 10;
      const accentByStatus = tk.orderStatus === 'ready' ? '#5fbf7f' : (tk.orderStatus === 'preparing' ? '#e0a86a' : '#4a4234');

      const items = tk.items.map(it => {
        const sm = this.stateMeta(it.st);
        const isReady = it.st === 'ready';
        return {
          qtyLabel: it.qty + '×',
          name: it.name,
          note: it.note || false,
          check: isReady ? '✓' : '',
          checkStyle: `width:22px;height:22px;flex-shrink:0;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;border:2px solid ${sm.dot};background:${isReady ? sm.dot : 'transparent'};color:#1a1712;`,
          nameStyle: `font-size:14px;font-weight:700;color:${isReady ? '#8a7c66' : '#f2e9dc'};${isReady ? 'text-decoration:line-through;text-decoration-color:#5a5142;' : ''}`,
          pillStyle: `flex-shrink:0;font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:${sm.pillBg};color:${sm.pillFg};`,
          stateLabel: sm.label,
          rowStyle: `width:100%;display:flex;align-items:center;gap:10px;padding:10px 8px;border:none;background:transparent;border-bottom:1px solid #2a251c;cursor:pointer;text-align:left;font-family:'Manrope',sans-serif;`,
          onToggle: () => this.cycleItem(tk.id, it.idx, tk.items[it.idx].s),
        };
      });

      return {
        cardStyle: `display:flex;flex-direction:column;min-height:220px;background:#241f18;border:1px solid #322b21;border-top:4px solid ${accentByStatus};border-radius:16px;overflow:hidden;`,
        headStyle: `display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:12px 12px 10px;border-bottom:1px solid #2f291f;background:#26211a;`,
        typeBadge: `font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:${tm.bg};color:${tm.fg};`,
        typeLabel: tm.label,
        title: tk.where,
        orderNo: tk.no,
        timer: tk.placedMin + ' min',
        timerStyle: `font-size:12px;font-weight:800;color:${late ? '#e59a86' : '#8a7c66'};`,
        items,
        onAdvance: () => this.advanceTicket(tk, tk.orderStatus),
        advanceLabel: tk.allReadyVisible ? 'Bump · all ready ✓' : 'Mark all ready',
        advanceStyle: `width:100%;padding:12px;border-radius:11px;border:none;font-family:'Manrope',sans-serif;font-weight:800;font-size:13.5px;cursor:pointer;background:${tk.allReadyVisible ? '#0e8a6a' : '#c65d3b'};color:#fff;`,
      };
    });

    return {
      clock: s.clock,
      filters,
      legend,
      tickets,
      allEmpty: tickets.length === 0,
    };
  }
}
</script>
</body>
</html>
