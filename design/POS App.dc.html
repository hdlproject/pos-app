<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Manrope', system-ui, sans-serif; color: #2a241d; background: #efe7da; -webkit-font-smoothing: antialiased; }
  a { color: #c65d3b; text-decoration: none; }
  a:hover { color: #a94a2c; }
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;background:#efe7da;">

  <!-- App switcher bar -->
  <div style="display:flex;align-items:center;gap:16px;padding:9px 16px;background:#2a241d;color:#fff;position:sticky;top:0;z-index:100;flex-shrink:0;">
    <div style="display:flex;align-items:center;gap:9px;">
      <div style="width:30px;height:30px;border-radius:9px;background:#c65d3b;display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:17px;line-height:1;">K</div>
      <span style="font-family:'DM Serif Display',serif;font-size:15px;letter-spacing:.01em;">Kopi &amp; Co</span>
    </div>

    <div style="display:flex;gap:4px;background:#221d16;padding:4px;border-radius:12px;margin-left:6px;">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
        <button onClick="{{ t.onClick }}" style="{{ t.style }}">
          <span style="font-size:14px;">{{ t.icon }}</span>
          <span>{{ t.label }}</span>
        </button>
      </sc-for>
    </div>

    <div style="margin-left:auto;display:flex;align-items:center;gap:12px;">
      <span style="font-size:11.5px;font-weight:700;color:#b5a48c;letter-spacing:.02em;">{{ roleLabel }}</span>
      <span style="width:1px;height:18px;background:#463d31;"></span>
      <span style="display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:#cabba3;">
        <span style="width:7px;height:7px;border-radius:50%;background:#5fbf7f;box-shadow:0 0 0 3px rgba(95,191,127,.2);"></span>Live
      </span>
    </div>
  </div>

  <!-- Mounted surface -->
  <div style="flex:1;min-height:0;position:relative;">
    <sc-if value="{{ showPOS }}" hint-placeholder-val="{{ true }}">
      <dc-import name="Staff POS" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ showKDS }}" hint-placeholder-val="{{ false }}">
      <dc-import name="Kitchen Display" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ showAdmin }}" hint-placeholder-val="{{ false }}">
      <dc-import name="Admin Dashboard" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ showQR }}" hint-placeholder-val="{{ false }}">
      <dc-import name="QR Menu" hint-size="100%,100%"></dc-import>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:860}}">
class Component extends DCLogic {
  state = { surface: 'pos' };

  renderVals() {
    const s = this.state;
    const defs = [
      { key: 'pos', icon: '🛎', label: 'Staff POS', role: 'Cashier · Rina A.' },
      { key: 'kds', icon: '🍳', label: 'Kitchen', role: 'Kitchen display' },
      { key: 'admin', icon: '📊', label: 'Admin', role: 'Admin · Budi W.' },
      { key: 'qr', icon: '📱', label: 'QR Menu', role: 'Guest · Table 5' },
    ];
    const tabs = defs.map(d => {
      const active = s.surface === d.key;
      return {
        icon: d.icon, label: d.label,
        onClick: () => this.setState({ surface: d.key }),
        style: `display:flex;align-items:center;gap:7px;padding:8px 14px;border:none;border-radius:9px;background:${active ? '#c65d3b' : 'transparent'};color:${active ? '#fff' : '#b5a48c'};font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;cursor:pointer;transition:all .12s;`,
      };
    });
    return {
      tabs,
      roleLabel: defs.find(d => d.key === s.surface).role,
      showPOS: s.surface === 'pos',
      showKDS: s.surface === 'kds',
      showAdmin: s.surface === 'admin',
      showQR: s.surface === 'qr',
    };
  }
}
</script>
</body>
</html>
